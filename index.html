<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2e9">
  <meta name="description" content="Walk into the spiral and discover a world with no fixed up or down. A Three.js gravity platformer.">
  <title>The Unnamed Realm · Spiral Wander</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d76545'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./game/style.css">
</head>
<body>
  <main id="game" aria-label="Spiral platformer">
    <canvas id="world" aria-label="Use A and D to move. Press Space to jump, then press again in the air to double jump." tabindex="0"></canvas>
    <section class="objective" aria-label="Exploration progress">
      <div><span>Into the spiral</span><strong id="progress">00<span>%</span></strong></div>
      <div class="meter"><i id="progress-fill"></i></div>
    </section>
    <aside class="map" aria-label="Local world map"><svg id="minimap" viewBox="-42 -25.2 84 50.4" role="img" aria-label="Nearby ground centered on the player"><path id="map-path"></path><circle id="map-player" r="1.4"></circle></svg><span>WORLD MAP</span></aside>
    <footer><div class="instructions"><span><kbd>A</kbd><kbd>D</kbd> Move</span><span><kbd>SPACE</kbd> Jump</span><span><kbd>V</kbd> Zoom</span><span><kbd>R</kbd> Restart</span><button id="fullscreen" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Press Esc to exit. Click or press F to enter fullscreen."><kbd>ESC / F</kbd><span data-fullscreen-label>Fullscreen</span></button></div></footer>
    <div id="loading" class="loading" role="status">Unfolding the spiral…</div>
  </main>
  <script type="module" src="./game/main.js"></script>
</body>
</html>
