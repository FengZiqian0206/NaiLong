<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2e9">
  <meta name="description" content="沿着螺旋行走，重新认识上下。一个使用 Three.js 制作的引力平台跳跃原型。">
  <title>未名之境 · 螺旋漫游</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d76545'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./game/style.css">
</head>
<body>
  <main id="game" aria-label="螺旋平台跳跃游戏">
    <canvas id="world" aria-label="使用 A、D 沿地面移动，空格跳跃" tabindex="0"></canvas>
    <section class="objective" aria-label="探索进度">
      <div><span>向螺旋深处</span><strong id="progress">00<span>%</span></strong></div>
      <div class="meter"><i id="progress-fill"></i></div>
    </section>
    <aside class="map" aria-label="世界地图"><svg id="minimap" viewBox="-55 -33 110 66" role="img" aria-label="玩家在螺旋中的位置"><path id="map-path"></path><circle id="map-player" r="2"></circle></svg><span>WORLD MAP</span></aside>
    <footer><div class="instructions"><span><kbd>A</kbd><kbd>D</kbd> 行走</span><span><kbd>SPACE</kbd> 跳跃</span><span><kbd>V</kbd> 视角</span><span><kbd>R</kbd> 重来</span></div></footer>
    <div id="loading" class="loading" role="status">正在展开螺旋世界…</div>
  </main>
  <script type="module" src="./game/main.js"></script>
</body>
</html>
